<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Randevu Alın</title>
    <link rel="stylesheet" href="deneme1.css">
</head>
<body>

<div class="container">
    <h2>Randevu Alın</h2>

    <div class="row">
        <div class="form-group">
            <label>Adınız Soyadınız:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Telefon Numaranız:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Tarih Seçiniz:</label>
            <input type="date">
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Hizmet Seçiniz:</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>Hizmet Seçiniz:</label>
            <select>
                <option>Hizmet Seçiniz...</option>
                <option>Saç Kesimi</option>
                <option>Saç Boyama</option>
                <option>Cilt Bakımı</option>
                <option>Ayak Bakımı</option>
            </select>
        </div>
    </div>

    <div class="form-group full">
        <label>Notunuz:</label>
        <textarea></textarea>
    </div>

    <button class="btn">RANDEVU TALEP ET</button>
</div>

</body>
</html>
