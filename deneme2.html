<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Randevu Alın</title>
    <link rel="stylesheet" href="deneme2.css">

    <!-- ikon için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="container">
    
    <div class="header">
        <i class="fa-solid fa-calendar-days"></i>
        <h2>Randevu Alın</h2>
    </div>

    <hr>

    <div class="row">
        <div class="form-group">
            <label>Adınız Soyadınız:</label>
            <input type="text" placeholder="Adınız Soyadınız">
        </div>

        <div class="form-group">
            <label>Telefon Numaranız:</label>
            <input type="text" placeholder="Telefon Numaranız">
        </div>

        <div class="form-group">
            <label>Tarih Seçiniz:</label>
            <div class="date-box">
                <input type="date">
                <i class="fa-solid fa-calendar"></i>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="form-group">
            <label>Hizmet Seçiniz:</label>
            <select>
                <option>Hizmet Seçiniz...</option>
                <option>Saç Kesimi</option>
                <option>Saç Boyama</option>
                <option>Manikür & Pedikür</option>
                <option>Cilt Bakımı</option>
            </select>
        </div>

        <div class="form-group">
            <label>Hizmet Seçiniz:</label>
            <select>
                <option>Hizmet Seçiniz...</option>
                <option>Saç Kesimi</option>
                <option>Saç Boyama</option>
                <option>Manikür & Pedikür</option>
                <option>Cilt Bakımı</option>
            </select>
        </div>
    </div>

    <div class="form-group full">
        <label>Notunuz:</label>
        <textarea placeholder="Notunuz"></textarea>
    </div>

    <button class="btn">RANDEVU TALEP ET</button>

</div>

</body>
</html>
